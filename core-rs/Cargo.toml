[package]
name = "mini-canvas-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Small software canvas core for mini-canvas"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.17"
tiny-skia = "0.11"
wasm-bindgen = "0.2"

[dev-dependencies]
png = "0.17"
